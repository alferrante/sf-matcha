<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-33.333%); }
  }
  @keyframes wobble0 {
    0%,100% { transform: translate(-50%, -50%) rotate(0deg); }
    50% { transform: translate(-50%, -50%) rotate(4deg); }
  }
  @keyframes wobble1 {
    0%,100% { transform: translate(-50%, -50%) rotate(0deg); }
    50% { transform: translate(-50%, -50%) rotate(-3deg); }
  }
  @keyframes wobble2 {
    0%,100% { transform: translate(-50%, -50%) translateY(0); }
    50% { transform: translate(-50%, -50%) translateY(-3px); }
  }
  @keyframes wobble3 {
    0%,100% { transform: translate(-50%, -50%) rotate(-2deg); }
    50% { transform: translate(-50%, -50%) rotate(3deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 10px; height: 10px; }

  input::placeholder { color: #1a1a1a; opacity: 0.4; }

  .shop-list { container-type: inline-size; }

  @container (max-width: 480px) {
    .shop-card {
      grid-template-columns: auto minmax(0, 1fr) !important;
      grid-template-areas:
        "icon content"
        "meta meta";
    }
    .shop-card-icon { grid-area: icon; }
    .shop-card-content { grid-area: content; }
    .shop-card-meta {
      grid-area: meta;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .shop-card-hours { width: auto !important; }
  }

  @media (max-width: 920px) {
    .main-grid {
      grid-template-columns: 1fr !important;
      padding: 0 16px 32px !important;
    }
    .map-panel {
      position: relative !important;
      top: auto !important;
      width: 100% !important;
      min-height: 0 !important;
      aspect-ratio: 1 / 1.08 !important;
      border-radius: 24px !important;
      box-shadow: 5px 5px 0 #1a1a1a !important;
    }
    .shop-list {
      max-height: none !important;
      overflow: visible !important;
    }
  }

  @media (max-width: 600px) {

      align-items: flex-end !important;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)) !important;
    }
    .shop-detail {

      border-radius: 22px !important;

    }

    }

      font-size: 30px !important;
      padding-right: 40px !important;
    }
    .shop-detail-body {
