services:
  - type: web
    name: sf-matcha
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: echo "Static site is prebuilt"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /dist/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
