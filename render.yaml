services:
  - type: web
    name: sfmatcha
    runtime: static
    repo: https://github.com/alferrante/sf-matcha
    branch: main
    autoDeploy: true
    buildCommand: |
      printf 'window.SF_MATCHA_CONFIG = { googleMapsApiKey: "%s" };\n' "$GOOGLE_MAPS_API_KEY" > config.js
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /dist/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
