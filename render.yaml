services:
  - type: web
    name: sfmatcha
    runtime: static
    repo: https://github.com/alferrante/sf-matcha
    branch: main
    autoDeploy: true
    buildCommand: |
      npm ci --include=dev
      npm run build
      npm run config
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /dist/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /config.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
